function StdF({label,size,mod,on}){const ex=size/mod;const std=Math.abs(ex-Math.round(ex))<0.01;const disp=std?Math.round(ex):null;return(<label className="f">{label}<span className="stepper"><span className="val">{disp==null?"–":disp}</span><span className="stpcol"><button type="button" onClick={()=>on((std?disp:Math.floor(ex))+1)}>▲</button><button type="button" onClick={()=>on(Math.max(0,(std?disp:Math.ceil(ex))-1))}>▼</button></span></span></label>);}
function Pal({onClick,nm,sw,dash,wavy,chair}){return(<button className="pal" onClick={onClick}><span className="sw" style={(wavy||chair)?{}:(dash?{border:`2px dashed ${sw}`}:{background:sw+"33",border:`1.5px solid ${sw}`})}>{wavy&&<svg width="15" height="15" viewBox="0 0 15 15"><path d="M0 8 Q3.75 3 7.5 8 T15 8" fill="none" stroke={sw} strokeWidth="1.6"/></svg>}{chair&&<svg width="14" height="14" viewBox="0 0 14 14"><rect x="2" y="2" width="10" height="10" rx="1.5" fill={sw+"33"} stroke={sw} strokeWidth="1.2"/><line x1="2" y1="12" x2="12" y2="12" stroke={sw} strokeWidth="2.2"/></svg>}</span><span className="nm">{nm}</span><span className="pl">+</span></button>);}

  useEffect(()=>{if(!exportOpen){setExportPreview("");return;}const t=setTimeout(()=>{const svg=buildExportSVG();setExportPreview(svg?"data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg):"");},70);return()=>clearTimeout(t);},[exportOpen,els,scale,rot,doc,expResumen,salonKey,comboIdx,showAlturas,showSillas]);
  function startResize(side,e){e.preventDefault();const sx=e.clientX,sL=leftW,sR=rightW;const mv=ev=>{if(side==="left")setLeftW(Math.max(190,Math.min(460,sL+(ev.clientX-sx))));else setRightW(Math.max(210,Math.min(520,sR-(ev.clientX-sx))));};const up=()=>{window.removeEventListener("mousemove",mv);window.removeEventListener("mouseup",up);document.body.style.cursor="";};window.addEventListener("mousemove",mv);window.addEventListener("mouseup",up);document.body.style.cursor="col-resize";}

  const [name,setName]=useState("");

  const svgRef=useRef(null), drag=useRef(null), marqRef=useRef(null), fileRef=useRef(null), centerRef=useRef(null), clip=useRef([]);
  const elsRef=useRef(els); elsRef.current=els;

  function fitScale(){

  // ---- historial ----
  function pushHist(){const h=histRef.current;h.past.push(elsRef.current);if(h.past.length>120)h.past.shift();h.future=[];force();}

  function redo(){const h=histRef.current;if(!h.future.length)return;h.past.push(elsRef.current);setEls(h.future.pop());setSelIds([]);force();}

  function mk(tipo,ex={}){
    const id=uid(); const x=ex.x??W/2, y=ex.y??L/2;
    if(tipo==="escenario"){const c=ex.cols??gen.escCols,r=ex.rows??gen.escRows;return{id,tipo,x,y,rot:ex.rot??0,cols:c,rows:r,w:c*MOD_ESC.w,h:r*MOD_ESC.h,modW:MOD_ESC.w,modH:MOD_ESC.h};}
    if(tipo==="pista"){const c=ex.cols??gen.pistaCols,r=ex.rows??gen.pistaRows;return{id,tipo,x,y,rot:0,cols:c,rows:r,w:c*MOD_PISTA.w,h:r*MOD_PISTA.h,modW:MOD_PISTA.w,modH:MOD_PISTA.h};}
    if(tipo==="auditorio"){const cols=ex.cols??10,rows=ex.rows??6,aisles=ex.aisles??1,aw=ex.aisleW??1.2;const d=audDims(cols,rows,aisles,aw);return{id,tipo,x,y,rot:ex.rot??0,cols,rows,aisles,aisleW:aw,w:d.w,h:d.h};}
    if(tipo==="aereo"){return{id,tipo,x,y,rot:0,w:ex.w??4,h:ex.h??4};}

    if(tipo==="texto"){const t=ex.text||"Texto";return{id,tipo,x,y,rot:ex.rot??0,text:t,w:Math.max(1,t.length*0.28),h:0.6};}
    const c=CAT[tipo];
    if(c.forma==="circ")return{id,tipo,x,y,rot:0,d:c.d,w:c.d,h:c.d,sillas:ex.sillas??c.sillas??0};
    return{id,tipo,x,y,rot:ex.rot??0,w:c.w,h:c.h,sillas:ex.sillas??c.sillas??0};
  }
  const add=t=>{pushHist();const e=mk(t);setEls(p=>[...p,e]);setSelIds([e.id]);};
  function addTexto(){pushHist();const e=mk("texto");const t=window.prompt("Texto de la aclaración:","");const txt=(t==null||t==="")?"Texto":t;e.text=txt;e.w=Math.max(1,txt.length*0.28);setEls(p=>[...p,e]);setSelIds([e.id]);}
  function dbl(id){
    const el=elsRef.current.find(e=>e.id===id); if(!el)return;
    if(el.tipo==="texto"){const t=window.prompt("Texto de la aclaración:",el.text||"");if(t!=null){pushHist();setEls(p=>p.map(e=>e.id===id?{...e,text:t,w:Math.max(1,t.length*0.28)}:e));}return;}
    if(esMesa(el.tipo)){const n=window.prompt("Número / nombre de la mesa:",el.num||"");if(n!=null){pushHist();setEls(p=>p.map(e=>e.id===id?{...e,num:n}:e));}}
  }
  function groupAlign(axis){
    if(selIds.length<2)return;
    pushHist();
    const sel=elsRef.current.filter(e=>selIds.includes(e.id));
    const avg=sel.reduce((a,e)=>a+e[axis],0)/sel.length;
    setEls(p=>p.map(e=>selIds.includes(e.id)?{...e,[axis]:avg}:e));
  }
  function groupDistribute(axis){
    if(selIds.length<3)return;
    pushHist();
    const sel=elsRef.current.filter(e=>selIds.includes(e.id)).sort((a,b)=>a[axis]-b[axis]);
    const min=sel[0][axis],max=sel[sel.length-1][axis],step=(max-min)/(sel.length-1),pos={};
    sel.forEach((e,i)=>pos[e.id]=min+step*i);
    setEls(p=>p.map(e=>pos[e.id]!=null?{...e,[axis]:pos[e.id]}:e));
  }
  const selGrouped=()=>{const sel=els.filter(e=>selIds.includes(e.id));return sel.length>0&&sel.every(e=>e.grp&&e.grp===sel[0].grp);};
  function agrupar(){if(selIds.length<2)return;const g="g"+Date.now();pushHist();setEls(p=>p.map(e=>selIds.includes(e.id)?{...e,grp:g}:e));}
  function desagrupar(){pushHist();setEls(p=>p.map(e=>selIds.includes(e.id)?{...e,grp:undefined}:e));}
  function updAud(id,patch){pushHist();setEls(p=>p.map(e=>{if(e.id!==id)return e;const m={...e,...patch};const d=audDims(m.cols,m.rows,m.aisles,m.aisleW);return {...m,w:d.w,h:d.h};}));}
  const upd=(id,patch)=>setEls(p=>p.map(e=>e.id===id?{...e,...patch}:e));
  const updH=(id,patch)=>{pushHist();upd(id,patch);};

  function groupRotate(d){pushHist();setEls(p=>p.map(e=>selIds.includes(e.id)?{...e,rot:((e.rot||0)+d)%360}:e));}
  function groupDup(){pushHist();const copies=els.filter(e=>selIds.includes(e.id)).map(e=>({...e,id:uid(),x:Math.min(W-.5,e.x+1),y:Math.min(L-.5,e.y+1)}));setEls(p=>[...p,...copies]);setSelIds(copies.map(c=>c.id));}
  function groupDel(){pushHist();setEls(p=>p.filter(e=>!selIds.includes(e.id)));setSelIds([]);}

  // ---- pantalla -> sala ----
  function screenToRoom(clientX,clientY){
    const rect=svgRef.current.getBoundingClientRect();
    const kx=svgW/rect.width, ky=svgH/rect.height;
    const sx=(clientX-rect.left)*kx, sy=(clientY-rect.top)*ky;
    let cx,cy;
    if(rot===0){cx=sx;cy=sy;}
    else if(rot===90){cx=sy;cy=contentH-sx;}
    else if(rot===180){cx=contentW-sx;cy=contentH-sy;}
    else{cx=contentW-sy;cy=sx;}
    return {x:(cx-PAD)/scale-FOY,y:(cy-PAD)/scale};
  }

  // ---- arrastre (individual o grupo) ----
  function down(e,id){
    e.stopPropagation();
    const clk=elsRef.current.find(el=>el.id===id);
    const grpIds=clk&&clk.grp?elsRef.current.filter(el=>el.grp===clk.grp).map(el=>el.id):null;
    if(e.shiftKey){setSelIds(prev=>prev.includes(id)?prev.filter(x=>x!==id):[...prev,...(grpIds||[id])]);return;}
    let ids;
    if(grpIds){ids=grpIds;setSelIds(grpIds);}
    else if(selIds.includes(id)&&selIds.length>1)ids=selIds; else {ids=[id];setSelIds([id]);}
    pushHist();
    let startEls;
    if(e.altKey){
      const grpMap={};
      const copies=elsRef.current.filter(el=>ids.includes(el.id)).map(el=>{const n={...el,id:uid()};if(el.grp){if(!grpMap[el.grp])grpMap[el.grp]=uid();n.grp=grpMap[el.grp];}return n;});
      setEls(p=>[...p,...copies]);ids=copies.map(c=>c.id);setSelIds(ids);startEls=copies;
    } else { startEls=elsRef.current.filter(el=>ids.includes(el.id)); }
    const starts={}; startEls.forEach(el=>{starts[el.id]={x:el.x,y:el.y};});
    drag.current={ids,sx:e.clientX,sy:e.clientY,starts};
    e.currentTarget.setPointerCapture&&e.currentTarget.setPointerCapture(e.pointerId);
  }

  function move(e){
    if(drag.current){
      const d=drag.current;
      const p0=screenToRoom(d.sx,d.sy), p1=screenToRoom(e.clientX,e.clientY);
      const dx=p1.x-p0.x, dy=p1.y-p0.y;
      setEls(p=>p.map(el=>{if(d.starts[el.id]){let nx=snap(d.starts[el.id].x+dx,imn),ny=snap(d.starts[el.id].y+dy,imn);return{...el,x:Math.max(0,Math.min(W,nx)),y:Math.max(0,Math.min(L,ny))};}return el;}));
    } else if(marqRef.current){
      const p=screenToRoom(e.clientX,e.clientY);
      setMarquee({...marqRef.current,x1:p.x,y1:p.y});
    }
  }
  function up(e){
    if(drag.current){drag.current=null;}
    if(marqRef.current){
      const mq=marqRef.current, p=screenToRoom(e.clientX,e.clientY);
      const minX=Math.min(mq.x0,p.x),maxX=Math.max(mq.x0,p.x),minY=Math.min(mq.y0,p.y),maxY=Math.max(mq.y0,p.y);
      if((maxX-minX)>0.3||(maxY-minY)>0.3){
        const hit=elsRef.current.filter(el=>el.x>=minX&&el.x<=maxX&&el.y>=minY&&el.y<=maxY).map(el=>el.id);
        setSelIds(mq.shift?prev=>Array.from(new Set([...prev,...hit])):hit);

      marqRef.current=null;setMarquee(null);
    }

  useEffect(()=>{
    function k(ev){
      const typing=["INPUT","SELECT","TEXTAREA"].includes(document.activeElement?.tagName);
      if((ev.metaKey||ev.ctrlKey)&&(ev.key==="z"||ev.key==="Z")){ev.preventDefault();ev.shiftKey?redo():undo();return;}
      if((ev.metaKey||ev.ctrlKey)&&(ev.key==="c"||ev.key==="C")&&selIds.length&&!typing){ev.preventDefault();clip.current=elsRef.current.filter(e=>selIds.includes(e.id)).map(e=>({...e}));return;}
      if((ev.metaKey||ev.ctrlKey)&&(ev.key==="v"||ev.key==="V")&&clip.current.length&&!typing){ev.preventDefault();const grpMap={};const copies=clip.current.map(e=>{const n={...e,id:uid(),x:Math.min(W-.5,e.x+1),y:Math.min(L-.5,e.y+1)};if(e.grp){if(!grpMap[e.grp])grpMap[e.grp]=uid();n.grp=grpMap[e.grp];}return n;});pushHist();setEls(p=>[...p,...copies]);setSelIds(copies.map(c=>c.id));return;}
      if((ev.key==="Delete"||ev.key==="Backspace")&&selIds.length&&!typing){ev.preventDefault();pushHist();setEls(p=>p.filter(e=>!selIds.includes(e.id)));setSelIds([]);return;}
      if(ev.key.startsWith("Arrow")&&selIds.length&&!typing){
        ev.preventDefault();
        const step=ev.shiftKey?0.05:0.25;
        const rv={0:[1,0],90:[0,-1],180:[-1,0],270:[0,1]}[rot];
        const dv={0:[0,1],90:[1,0],180:[0,-1],270:[-1,0]}[rot];
        let dx=0,dy=0;
        if(ev.key==="ArrowRight"){dx=rv[0]*step;dy=rv[1]*step;}
        else if(ev.key==="ArrowLeft"){dx=-rv[0]*step;dy=-rv[1]*step;}
        else if(ev.key==="ArrowDown"){dx=dv[0]*step;dy=dv[1]*step;}
        else{dx=-dv[0]*step;dy=-dv[1]*step;}
        pushHist();setEls(p=>p.map(e=>selIds.includes(e.id)?{...e,x:Math.max(0,Math.min(W,e.x+dx)),y:Math.max(0,Math.min(L,e.y+dy))}:e));
      }
    }
    window.addEventListener("keydown",k);return()=>window.removeEventListener("keydown",k);
  },[selIds,rot,W,L]);

  function generar(){
    const out=[]; const m=1.3;
    const vert=(gen.pared==="izquierda"||gen.pared==="derecha");
    const hayEsc=gen.escCols>=1&&gen.escRows>=1;
    const hayPista=gen.pistaCols>=1&&gen.pistaRows>=1;
    let sx=W/2,sy=L/2,sFW=0,sFH=0;
    if(hayEsc){
      const sw=gen.escCols*MOD_ESC.w, sh=gen.escRows*MOD_ESC.h;
      sFW=vert?sh:sw; sFH=vert?sw:sh;
      if(gen.pared==="arriba"){sx=W/2;sy=m+sFH/2;}
      else if(gen.pared==="abajo"){sx=W/2;sy=L-m-sFH/2;}
      else if(gen.pared==="izquierda"){sx=m+sFW/2;sy=L/2;}
      else{sx=W-m-sFW/2;sy=L/2;}
      out.push(mk("escenario",{x:sx,y:sy,cols:gen.escCols,rows:gen.escRows,rot:vert?90:0}));
    }
    const chairRot={arriba:180,abajo:0,izquierda:90,derecha:270};
    function entelarTodo(arr){
      const ins=0.25,pad=0.12;
      ["top","bottom","left","right"].forEach(wall=>{
        if(wall==="top"&&combo.from!==1)return;
        if(wall==="bottom"&&combo.to!==S.sections.length)return;
        const isH=wall==="top"||wall==="bottom",total=isH?W:L,gaps=[];
        S.doors.green.forEach(d=>{if(d[0]!==wall)return;let p;if(isH){if(d[1]>W)return;p=d[1];}else{p=d[1]-off;if(p<-0.01||p>total+0.01)return;}gaps.push([p-d[2]/2,p+d[2]/2]);});
        gaps.sort((a,b)=>a[0]-b[0]);
        let cur=0;const segs=[];
        gaps.forEach(g=>{const s=Math.max(0,g[0]-pad),e=Math.min(total,g[1]+pad);if(s>cur+0.3)segs.push([cur,s]);cur=Math.max(cur,e);});
        if(cur<total-0.3)segs.push([cur,total]);
        segs.forEach(([a,b])=>{const len=b-a,cen=(a+b)/2;if(len<0.4)return;
          if(wall==="top")arr.push(mk("entelado",{x:cen,y:ins,w:len,rot:0}));
          else if(wall==="bottom")arr.push(mk("entelado",{x:cen,y:L-ins,w:len,rot:0}));
          else if(wall==="left")arr.push(mk("entelado",{x:ins,y:cen,w:len,rot:90}));
          else arr.push(mk("entelado",{x:W-ins,y:cen,w:len,rot:90}));});
      });
    }

    if(gen.modo==="sillas"){
      const aisles=Math.max(0,gen.pasillos||0);
      const cols=Math.max(1,gen.sillasCols||1),rows=Math.max(1,gen.sillasFilas||1);
      let cx,cy;
      if(gen.pared==="arriba"){cx=W/2;cy=(hayEsc?sy+sFH/2:m)+(L-(hayEsc?sy+sFH/2:m)-m)/2;}
      else if(gen.pared==="abajo"){cx=W/2;cy=m+((hayEsc?sy-sFH/2:L-m)-m)/2;}
      else if(gen.pared==="izquierda"){cy=L/2;cx=(hayEsc?sx+sFW/2:m)+(W-(hayEsc?sx+sFW/2:m)-m)/2;}
      else{cy=L/2;cx=m+((hayEsc?sx-sFW/2:W-m)-m)/2;}
      const aud=mk("auditorio",{x:cx,y:cy,cols,rows,aisles,aisleW:1.2,rot:chairRot[gen.pared]});
      out.push(aud);pushHist();setEls(out);setSelIds([aud.id]);
      if(gen.entelar)entelarTodo(out),setEls([...out]);
      flash(`Generadas ${cols*rows} sillas (${rows} filas × ${cols} columnas).`);
      return;
    }

    let pxc=W/2,pyc=L/2,pw=0,ph=0;
    if(hayPista){
      pw=gen.pistaCols*MOD_PISTA.w; ph=gen.pistaRows*MOD_PISTA.h;
      if(gen.pared==="arriba"){pxc=W/2;pyc=(hayEsc?sy+sFH/2+0.4:m)+ph/2;}
      else if(gen.pared==="abajo"){pxc=W/2;pyc=(hayEsc?sy-sFH/2-0.4:L-m)-ph/2;}
      else if(gen.pared==="izquierda"){pxc=(hayEsc?sx+sFW/2+0.4:m)+pw/2;pyc=L/2;}
      else{pxc=(hayEsc?sx-sFW/2-0.4:W-m)-pw/2;pyc=L/2;}
      out.push(mk("pista",{x:pxc,y:pyc,cols:gen.pistaCols,rows:gen.pistaRows}));
    }

    const bw=CAT.barra.w, bh=CAT.barra.h, zonasBar=[];
    if(!vert){
      const by=gen.pared==="arriba"?L-m-bh/2:m+bh/2;
      let bx=W/2-(gen.barras*bw)/2+bw/2;
      for(let i=0;i<gen.barras;i++){out.push(mk("barra",{x:bx,y:by}));zonasBar.push({x:bx,y:by,w:bw,h:bh});bx+=bw;}
    }else{
      const bx=gen.pared==="izquierda"?W-m-bh/2:m+bh/2;
      let by=L/2-(gen.barras*bw)/2+bw/2;
      for(let i=0;i<gen.barras;i++){out.push(mk("barra",{x:bx,y:by,rot:90}));zonasBar.push({x:bx,y:by,w:bh,h:bw});by+=bw;}
    }

    // RESERVA: banda del escenario (si hay) + pista (si hay) + barras
    const zonas=[];
    if(hayEsc){ if(!vert)zonas.push({x:W/2,y:sy,w:W+4,h:sFH+1.6}); else zonas.push({x:sx,y:L/2,w:sFW+1.6,h:L+4}); }
    if(hayPista) zonas.push({x:pxc,y:pyc,w:pw+1.0,h:ph+1.0});
    zonasBar.forEach(z=>zonas.push({x:z.x,y:z.y,w:z.w+0.6,h:z.h+1.2}));
    const choca=(x,y,w,h)=>zonas.some(z=>Math.abs(x-z.x)<(w+z.w)/2&&Math.abs(y-z.y)<(h+z.h)/2);

    // mesas: redondas se reparten en el salón; escuela/rectangulares se empacan juntas con separación chica
    const c=CAT[gen.tipoMesa];
    const tw=c.forma==="circ"?c.d:c.w, th=c.forma==="circ"?c.d:c.h;
    const rotMesa=gen.tipoMesa.startsWith("escuela")?(chairRot[gen.pared]+180)%360:0;
    const rotada=rotMesa%180!==0;
    const fw=rotada?th:tw, fh=rotada?tw:th;
    let sepX,sepY;
    if(c.forma==="circ"){sepX=sepY=c.zona||(c.d+1.0);}
    else{const lado=0.40,frente=0.80;sepX=rotada?th+frente:tw+lado;sepY=rotada?tw+lado:th+frente;}
    function lattice(sxs,sys){
      const ncol=Math.max(1,Math.floor((W-2*m-fw)/sxs)+1), nrow=Math.max(1,Math.floor((L-2*m-fh)/sys)+1);
      const gx=W/2-(ncol-1)*sxs/2, gy=L/2-(nrow-1)*sys/2;
      const pts=[];
      for(let r=0;r<nrow;r++)for(let cc=0;cc<ncol;cc++){const x=gx+cc*sxs,y=gy+r*sys;if(x<m+fw/2||x>W-m-fw/2||y<m+fh/2||y>L-m-fh/2)continue;if(choca(x,y,fw,fh))continue;pts.push({x,y});}
      return pts;
    }
    let pts=lattice(sepX,sepY), chosen;
    if(c.forma==="circ"){
      if(pts.length>gen.mesas){for(let f=1.05;f<=5;f+=0.05){const p=lattice(sepX*f,sepY*f);if(p.length<gen.mesas)break;pts=p;}}
      if(pts.length>gen.mesas){const st=pts.length/gen.mesas;chosen=[];for(let i=0;i<gen.mesas;i++)chosen.push(pts[Math.floor(i*st)]);}
      else chosen=pts;
    } else { chosen=pts.slice(0,gen.mesas); }
    chosen.forEach(s=>out.push(mk(gen.tipoMesa,{x:s.x,y:s.y,rot:rotMesa})));
    const placed=chosen.length;

    for(let i=0;i<gen.apoyo;i++){
      const k=Math.floor(i/2), first=i%2===0;
      if(!vert){const step=(L-2*m)/(Math.ceil(gen.apoyo/2)+1);out.push(mk("redonda_075",{x:first?m+.5:W-m-.5,y:m+step*(k+1)}));}
      else{const step=(W-2*m)/(Math.ceil(gen.apoyo/2)+1);out.push(mk("redonda_075",{x:m+step*(k+1),y:first?m+.5:L-m-.5}));}
    }
    pushHist();setEls(out);setSelIds([]);
    if(gen.entelar){entelarTodo(out);setEls([...out]);}
    flash(`Generado: ${placed} mesas distribuidas${placed<gen.mesas?" (no entraron todas)":""}.`);
  }

  const counts=useMemo(()=>{const c={};els.forEach(e=>c[e.tipo]=(c[e.tipo]||0)+1);return c;},[els]);

  const cubiertos=useMemo(()=>{let t=0;els.forEach(e=>{if(esMesa(e.tipo))t+=(e.sillas||0);else if(e.tipo==="auditorio")t+=(e.cols||0)*(e.rows||0);else if(e.tipo==="silla")t+=1;});return t;},[els]);

  const TR=(360-rot)%360;
  function sillasR(d,n){const r=(d/2+0.32)*scale,s=0.5*scale,a=[];for(let i=0;i<n;i++){const ang=(i/n)*Math.PI*2,cx=Math.cos(ang)*r,cy=Math.sin(ang)*r,deg=ang*180/Math.PI+90;a.push(<g key={i} transform={`translate(${cx},${cy}) rotate(${deg})`}><rect x={-s/2} y={-s/2} width={s} height={s} rx={2} fill="#e5e7eb" stroke="#6b7280" strokeWidth={.8}/><line x1={-s/2} y1={-s/2} x2={s/2} y2={-s/2} stroke="#6b7280" strokeWidth={1.4}/></g>);}return a;}
  function rectSeats(e,n){
    const s=0.5*scale,gap=0.10*scale,hw=e.w/2*scale,hh=e.h/2*scale,offY=hh+gap+s/2,offX=hw+gap+s/2,aw=e.w*scale,ah=e.h*scale;
    const bottom=k=>Array.from({length:k},(_,i)=>({cx:-aw/2+aw*(i+0.5)/k,cy:offY,deg:0}));
    const top=k=>Array.from({length:k},(_,i)=>({cx:-aw/2+aw*(i+0.5)/k,cy:-offY,deg:180}));
    const leftEnd={cx:-offX,cy:0,deg:90},rightEnd={cx:offX,cy:0,deg:270};
    const t=e.tipo;
    if(t==="mesa_editable"){const w=e.w,h=e.h,P=2*(w+h),oY=(h/2+0.35)*scale,oX=(w/2+0.35)*scale,out=[];for(let i=0;i<n;i++){let d=((i+0.5)/n)*P,cx,cy,deg;if(d<=w){cx=(-w/2+d)*scale;cy=-oY;deg=180;}else if(d<=w+h){cx=oX;cy=(-h/2+(d-w))*scale;deg=270;}else if(d<=2*w+h){cx=(w/2-(d-w-h))*scale;cy=oY;deg=0;}else{cx=-oX;cy=(h/2-(d-2*w-h))*scale;deg=90;}out.push({cx,cy,deg});}return out;}
    if(t==="cuadrada_090"){const order=[{cx:0,cy:-offY,deg:180},{cx:offX,cy:0,deg:270},{cx:0,cy:offY,deg:0},{cx:-offX,cy:0,deg:90}];return order.slice(0,Math.min(4,n));}
    if(t==="escuela_244x075"||t==="espejada_244x090"){const out=[];out.push(...bottom(Math.min(4,n)));if(n>4)out.push(...top(Math.min(4,n-4)));if(n>8)out.push(leftEnd);if(n>9)out.push(rightEnd);return out;}
    return bottom(n);
  }
  function sillasRect(e,n){const s=0.5*scale;return rectSeats(e,Math.max(0,n||0)).map((p,i)=><g key={i} transform={`translate(${p.cx},${p.cy}) rotate(${p.deg})`}><rect x={-s/2} y={-s/2} width={s} height={s} rx={2} fill="#e5e7eb" stroke="#6b7280" strokeWidth={.8}/><line x1={-s/2} y1={s/2} x2={s/2} y2={s/2} stroke="#6b7280" strokeWidth={1.4}/></g>);}
  function numText(e,c){if(e.num==null||e.num==="")return null;const fs=c.forma==="circ"?e.d*scale*0.5:Math.min(e.h*scale*0.85,e.w*scale*0.5);return <text textAnchor="middle" dominantBaseline="central" fontSize={fs} fontWeight="800" fill={c.stroke} fontFamily="var(--mono)" transform={`rotate(${TR-(e.rot||0)})`}>{e.num}</text>;}
  function modulos(e){const a=[];for(let c=1;c<e.cols;c++){const x=-e.w/2*scale+c*e.modW*scale;a.push(<line key={"v"+c} x1={x} y1={-e.h/2*scale} x2={x} y2={e.h/2*scale} stroke="rgba(0,0,0,.18)" strokeWidth={.5}/>);}for(let r=1;r<e.rows;r++){const y=-e.h/2*scale+r*e.modH*scale;a.push(<line key={"h"+r} x1={-e.w/2*scale} y1={y} x2={e.w/2*scale} y2={y} stroke="rgba(0,0,0,.18)" strokeWidth={.5}/>);}return a;}
  function enteladoPath(e){const len=e.w*scale,amp=0.2*scale,waves=Math.max(2,Math.round(e.w/0.7)),steps=waves*10;let d="M "+(-len/2)+" 0";for(let i=1;i<=steps;i++){const x=-len/2+(i/steps)*len,y=Math.sin((i/steps)*waves*2*Math.PI)*amp;d+=" L "+x.toFixed(1)+" "+y.toFixed(1);}return d;}

  function wordLabel(txt,e,color){
    const lo=Math.max(e.w,e.h),sh=Math.min(e.w,e.h);
    let fs=Math.min(sh*scale*0.6, lo*scale*0.92/Math.max(1,txt.length*0.6));

    const tot=(((e.rot||0)+rot)%360+360)%360;

    return <text textAnchor="middle" dominantBaseline="central" fontSize={fs} fontWeight="700" fill={color} fontFamily="var(--mono)" transform={`rotate(${TR-(e.rot||0)+(tall?90:0)})`}>{txt}</text>;
  }
  function labelSize(txt,e,color){

  function renderEl(e){

    else if(e.tipo==="auditorio"){const xs=audColsX(e.cols,e.aisles,e.aisleW);const w=e.w,h=e.h,a=[];for(let r=0;r<e.rows;r++)for(let ci=0;ci<e.cols;ci++){const x=(xs[ci]-w/2)*scale,y=(r*(SEAT+SGY)-h/2)*scale,ss=SEAT*scale;a.push(<g key={r+"_"+ci}><rect x={x} y={y} width={ss} height={ss} rx={2} fill="#e5e7eb" stroke="#9ca3af" strokeWidth={.7}/><line x1={x} y1={y+ss} x2={x+ss} y2={y+ss} stroke="#6b7280" strokeWidth={1.8}/></g>);}inner=<g>{a}</g>;}

    else if(e.tipo==="silla"){const ss=e.w*scale;inner=<g><rect x={-ss/2} y={-ss/2} width={ss} height={ss} rx={2} fill="#e5e7eb" stroke="#6b7280" strokeWidth={isS?2:1}/><line x1={-ss/2} y1={ss/2} x2={ss/2} y2={ss/2} stroke="#6b7280" strokeWidth={1.8}/></g>;}

    else{const ch=(esMesa(e.tipo)&&showSillas&&e.sillas)?sillasRect(e,e.sillas):null;const lbl=e.tipo==="barra"?wordLabel("BARRA",e,c.stroke):e.tipo==="dj"?labelSize("DJ",e,c.stroke):e.tipo==="parlante"?wordLabel("Parlante",e,c.stroke):e.tipo==="pantalla"?labelSize("PANTALLA",e,c.stroke):null;inner=<g>{ch}<rect x={-e.w/2*scale} y={-e.h/2*scale} width={e.w*scale} height={e.h*scale} fill={c.fill} stroke={c.stroke} strokeWidth={isS?2.5:1.4}/>{esMesa(e.tipo)&&numText(e,c)}{lbl}</g>;}

  function gridLines(){if(!grid)return null;const a=[];for(let mx=0;mx<=Math.ceil(W);mx++)a.push(<line key={"x"+mx} x1={px(mx)} y1={px(0)} x2={px(mx)} y2={px(L)} stroke={mx%5===0?"#cbd5e1":"#eef2f7"} strokeWidth={mx%5===0?1:.6}/>);for(let my=0;my<=Math.ceil(L);my++)a.push(<line key={"y"+my} x1={px(0)} y1={px(my)} x2={px(W)} y2={px(my)} stroke={my%5===0?"#cbd5e1":"#eef2f7"} strokeWidth={my%5===0?1:.6}/>);return <g>{a}</g>;}
  function divisorias(){if(!showDoors)return null;const a=[];for(let k=combo.from;k<combo.to;k++){const y=px(S.sections[k-1][1]-off);a.push(<line key={k} x1={px(0)} y1={y} x2={px(W)} y2={y} stroke="#f59e0b" strokeWidth={2.6} strokeDasharray="8 5"/>);}return <g>{a}</g>;}
  function roomOutline(){
    if(S.outline){const p=S.outline;let s=`M${px(p[0][0])} ${px(p[0][1]-off)}`;for(let i=1;i<p.length;i++)s+=` L${px(p[i][0])} ${px(p[i][1]-off)}`;return s+" Z";}
    const irr=S.irregular;
    if(!irr||irr.wall!=="left")return `M${px(0)} ${px(0)} L${px(W)} ${px(0)} L${px(W)} ${px(L)} L${px(0)} ${px(L)} Z`;
    const d=irr.depth,y0=off,y1=off+L;
    let bounds=[y0];
    irr.notches.forEach(n=>{if(n[0]>y0&&n[0]<y1)bounds.push(n[0]);if(n[1]>y0&&n[1]<y1)bounds.push(n[1]);});
    bounds.push(y1);bounds=[...new Set(bounds)].sort((a,b)=>a-b);
    const xAt=yy=>irr.notches.some(n=>yy>=n[0]&&yy<=n[1])?d:0;
    let pts=[];
    for(let k=0;k<bounds.length-1;k++){const x=xAt((bounds[k]+bounds[k+1])/2);pts.push([x,bounds[k]-off]);pts.push([x,bounds[k+1]-off]);}
    let p=`M${px(pts[0][0])} ${px(pts[0][1])}`;
    for(let k=1;k<pts.length;k++)p+=` L${px(pts[k][0])} ${px(pts[k][1])}`;
    p+=` L${px(W)} ${px(L)} L${px(W)} ${px(0)} Z`;

  function doorSeg(wall,pos,w,color,key){

    if(wall==="bottom"){if(combo.to!==S.sections.length||pos>W)return null;return <line key={key} x1={px(pos-w/2)} y1={px(L)} x2={px(pos+w/2)} y2={px(L)} stroke={color} strokeWidth={5} strokeLinecap="round"/>;}
    if(wall==="left"){const y=pos-off;if(y<-0.01||y>L+0.01)return null;const xw=(S.irregular&&S.irregular.wall==="left"&&S.irregular.notches.some(n=>pos>=n[0]&&pos<=n[1]))?S.irregular.depth:0;return <line key={key} x1={px(xw)} y1={px(y-w/2)} x2={px(xw)} y2={px(y+w/2)} stroke={color} strokeWidth={5} strokeLinecap="round"/>;}
    const y=pos-off;if(y<-0.01||y>L+0.01)return null;return <line key={key} x1={px(W)} y1={px(y-w/2)} x2={px(W)} y2={px(y+w/2)} stroke={color} strokeWidth={5} strokeLinecap="round"/>;
  }
  function puertas(){
    const a=[];
    S.doors.green.forEach((d,i)=>{const s=doorSeg(d[0],d[1],d[2],"#16a34a","g"+i);if(s)a.push(s);});
    (S.doors.porton||[]).forEach((d,i)=>{const s=doorSeg(d[0],d[1],d[2],"#0e7490","p"+i);if(s)a.push(s);});
    S.doors.red.forEach((d,i)=>{const s=doorSeg(d[0],d[1],d[2],"#dc2626","r"+i);if(s)a.push(s);});
    (S.doorSegs||[]).forEach((d,i)=>a.push(<line key={"ds"+i} x1={px(d[0])} y1={px(d[1]-off)} x2={px(d[2])} y2={px(d[3]-off)} stroke={d[4]} strokeWidth={5} strokeLinecap="round"/>));

  function fixtures(){

    (S.intWalls||[]).forEach((w,i)=>a.push(<line key={"iw"+i} x1={px(w[0])} y1={px(w[1]-off)} x2={px(w[2])} y2={px(w[3]-off)} stroke="#1e3a5f" strokeWidth={4} strokeLinecap="round"/>));
    (S.columns||[]).forEach((c,i)=>a.push(<polygon key={"col"+i} points={`${px(c[0])},${px(c[1]-off-s)} ${px(c[0]+s)},${px(c[1]-off)} ${px(c[0])},${px(c[1]-off+s)} ${px(c[0]-s)},${px(c[1]-off)}`} fill="#9ca3af" stroke="#475569" strokeWidth={1.2}/>));
    return <g style={{pointerEvents:"none"}}>{a}</g>;

  function alturas(){
    if(!showAlturas||!S.alturas)return null;
    const A=S.alturas,a=[],V=A.violeta,N=A.naranja,irr=S.irregular;
    const secOuter=(aTop,aBot)=>{
      if(!irr||irr.wall!=="left")return `M${px(0)} ${px(aTop-off)} L${px(W)} ${px(aTop-off)} L${px(W)} ${px(aBot-off)} L${px(0)} ${px(aBot-off)} Z`;
      const d=irr.depth;let bs=[aTop];irr.notches.forEach(n=>{if(n[0]>aTop&&n[0]<aBot)bs.push(n[0]);if(n[1]>aTop&&n[1]<aBot)bs.push(n[1]);});bs.push(aBot);bs=[...new Set(bs)].sort((x,y)=>x-y);
      const xAt=yy=>irr.notches.some(n=>yy>=n[0]&&yy<=n[1])?d:0;let pts=[];
      for(let k=0;k<bs.length-1;k++){const x=xAt((bs[k]+bs[k+1])/2);pts.push([x,bs[k]]);pts.push([x,bs[k+1]]);}
      let p=`M${px(pts[0][0])} ${px(pts[0][1]-off)}`;for(let k=1;k<pts.length;k++)p+=` L${px(pts[k][0])} ${px(pts[k][1]-off)}`;
      p+=` L${px(W)} ${px(aBot-off)} L${px(W)} ${px(aTop-off)} Z`;return p;
    };
    const rectD=(c,aTop,aBot)=>{const x1=c.ing,x2=W-c.back,y1=aTop+c.side-off,y2=aBot-c.side-off;return `M${px(x1)} ${px(y1)} L${px(x2)} ${px(y1)} L${px(x2)} ${px(y2)} L${px(x1)} ${px(y2)} Z`;};
    for(let i=combo.from-1;i<=combo.to-1;i++){
      const aTop=S.sections[i][0], aBot=S.sections[i][1];
      const mag=rectD(V,aTop,aBot), nar=rectD(N,aTop,aBot);
      a.push(<path key={"vf"+i} d={secOuter(aTop,aBot)+" "+mag} fillRule="evenodd" fill="#c4b5fd" opacity={0.22} stroke="none"/>);

      a.push(<path key={"nf"+i} d={nar} fill="#fdba74" opacity={0.18} stroke="none"/>);
      a.push(<path key={"nr"+i} d={nar} fill="none" stroke="#fb923c" strokeWidth={0.8}/>);
      if(A.viga){const iv=A.viga.inset;a.push(<rect key={"g"+i} x={px(iv)} y={px(aTop+iv-off)} width={(W-2*iv)*scale} height={(aBot-aTop-2*iv)*scale} fill="none" stroke="#111827" strokeWidth={1}/>);}
    }
    return <g style={{pointerEvents:"none"}}>{a}</g>;
  }
  function escalaBar(){const y=px(L)+22,cx=px(2.5);return <g fontFamily="var(--mono)"><line x1={px(0)} y1={y} x2={px(5)} y2={y} stroke="#1e3a5f" strokeWidth={2}/><line x1={px(0)} y1={y-4} x2={px(0)} y2={y+4} stroke="#1e3a5f" strokeWidth={2}/><line x1={px(5)} y1={y-4} x2={px(5)} y2={y+4} stroke="#1e3a5f" strokeWidth={2}/><rect x={cx-30} y={y-8} width={60} height={16} fill="#fff"/><text x={cx} y={y} textAnchor="middle" dominantBaseline="central" fontSize={10} fontWeight="700" fill="#1e3a5f">5 metros</text></g>;}
  function foyerRender(){
    if(!(showFoyer&&S.foyer))return null;

      for(let gy=Math.ceil(y0);gy<=y1;gy++)a.push(<line key={"fgy"+gy} x1={px(-d)} y1={PY(gy)} x2={px(0)} y2={PY(gy)} stroke={gy%5===0?"#cbd5e1":"#eef2f7"} strokeWidth={gy%5===0?1:.6}/>);

  const labelTipo=t=>t==="escenario"?"Escenario":t==="pista"?"Pista de baile":t==="aereo"?"Aéreo de pista":t==="entelado"?"Entelado de pared":(CAT[t]?.nm||t);
  function escXml(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
  function buildExportSVG(){
    if(!svgRef.current) return "";
    const plano=svgRef.current.cloneNode(true);
    plano.querySelectorAll(".no-export").forEach(n=>n.remove());
    const pad=26;
    const headerH=doc?66:34;
    const refs=[{c:"#16a34a",t:"Ingresos"}];
    if(S.doors.porton)refs.push({c:"#0e7490",t:"Portón"});
    refs.push({c:"#dc2626",t:"Ingreso Back"},{c:"#f59e0b",t:"Puertas divisorias"},{c:"#0d9488",t:"Entelado"});
    if(showAlturas&&S.alturas){refs.push({c:"#fdba74",t:"Altura "+S.alturas.centro+" m"},{c:"#c4b5fd",t:"Altura "+S.alturas.lateral+" m"});if(S.alturas.viga)refs.push({c:"#111827",t:"Viga (100 kg/m lineal)"});}

    const pageW=Math.max(svgW,520)+pad*2;
    const planoY=pad+headerH, salonY=planoY+svgH+22;
    let rx=pad, ry=salonY+26, refParts=[];
    refs.forEach(r=>{const w=11+8+r.t.length*6.0+18; if(rx+w>pageW-pad){rx=pad;ry+=22;} refParts.push(`<rect x="${rx}" y="${ry-9}" width="11" height="11" rx="2" fill="${r.c}"/><text x="${rx+16}" y="${ry}" font-size="11" fill="#334155" font-family="sans-serif">${escXml(r.t)}</text>`); rx+=w;});
    let resBottom=ry+12, resSVG="";
    if(expResumen&&resL.length){const ry0=resBottom+18; resSVG=`<text x="${pad}" y="${ry0}" font-size="12" font-weight="700" fill="#1e3a5f" font-family="sans-serif">Resumen</text>`+resL.map((l,i)=>`<text x="${pad}" y="${ry0+20+i*16}" font-size="11" fill="#334155" font-family="sans-serif">${escXml(l)}</text>`).join(""); resBottom=ry0+20+resL.length*16;}
    const pageH=resBottom+pad;
    const planoX=(pageW-svgW)/2;
    plano.setAttribute("width",svgW);plano.setAttribute("height",svgH);plano.setAttribute("viewBox",`0 0 ${svgW} ${svgH}`);plano.removeAttribute("style");
    const planoStr=`<g transform="translate(${planoX},${planoY})">`+new XMLSerializer().serializeToString(plano)+`</g>`;
    const header=doc
      ? `<text x="${pageW/2}" y="${pad+24}" text-anchor="middle" font-size="17" font-weight="700" fill="#1e3a5f" font-family="sans-serif">${escXml(doc.evento)}</text>`+(doc.plano?`<text x="${pageW/2}" y="${pad+46}" text-anchor="middle" font-size="12" fill="#64748b" font-family="sans-serif">${escXml(doc.plano)}</text>`:"")
      : `<text x="${pageW/2}" y="${pad+22}" text-anchor="middle" font-size="14" font-weight="700" fill="#94a3b8" font-family="sans-serif">Plano sin guardar</text>`;
    const salon=`<text x="${pageW/2}" y="${salonY}" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a5f" font-family="sans-serif">${escXml(salonLine)}</text>`;
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${pageW}" height="${pageH}" viewBox="0 0 ${pageW} ${pageH}"><rect width="${pageW}" height="${pageH}" fill="#ffffff"/>${header}${planoStr}${salon}${refParts.join("")}${resSVG}</svg>`;
  }
  function exportPlano(){
    const svgStr=buildExportSVG(); if(!svgStr) return;
    const m=svgStr.match(/width="([\d.]+)" height="([\d.]+)"/);
    const PW=m?+m[1]:svgW, PH=m?+m[2]:svgH;
    const url="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svgStr);
    const fname=(doc?(doc.plano||doc.evento||"plano"):"plano").replace(/[\\/:*?"<>|]/g,"-");

    img.onload=()=>{
      if(expFmt==="png"){const s=2,cv=document.createElement("canvas");cv.width=PW*s;cv.height=PH*s;const x=cv.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,cv.width,cv.height);x.drawImage(img,0,0,cv.width,cv.height);cv.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=fname+".png";a.click();});flash("Plano exportado en PNG.");}
      else{const w=window.open("","_blank");if(!w){flash("Permití las ventanas emergentes para exportar PDF.");return;}w.document.write(`<html><head><title>${escXml(fname)}</title><style>@page{margin:10mm}body{margin:0;display:flex;justify-content:center}img{max-width:100%}</style></head><body><img src="${url}"/></body></html>`);w.document.close();setTimeout(()=>{w.focus();w.print();},450);}
    };

  }

            <NumF label="Escen. cols" v={gen.escCols} min={0} on={n=>setGen({...gen,escCols:n})}/>
            <NumF label="Escen. filas" v={gen.escRows} min={0} on={n=>setGen({...gen,escRows:n})}/>
            {gen.modo==="mesas"&&<NumF label="Barras" v={gen.barras} min={0} on={n=>setGen({...gen,barras:n})}/>}
            <label className="f">Entelar todo<select value={gen.entelar?"si":"no"} onChange={e=>setGen({...gen,entelar:e.target.value==="si"})}><option value="no">No</option><option value="si">Sí</option></select></label>
          </div>
          {gen.modo==="mesas"&&<div className="muted">Pista: {fmt(gen.pistaCols*1.2)}×{fmt(gen.pistaRows*1.2)} m · ~{gen.pistaCols*gen.pistaRows*3} personas en pista</div>}
          {gen.modo==="sillas"&&<div className="muted">Total: <b>{gen.sillasFilas*gen.sillasCols} sillas</b> ({gen.sillasFilas} filas × {gen.sillasCols} columnas). Mirando al escenario, pasillos perpendiculares.</div>}
          <button className="btn btn-primary btn-block btn-big" style={{marginTop:10}} onClick={generar}><Ic d={I.wand} s={16}/> Generar plano</button>
          <button className="btn btn-block" style={{marginTop:6}} onClick={limpiar}><Ic d={I.trash} s={14}/> Vaciar todo</button>
        </div>
        <div className="card">
          <div className="card-h">Agregar elementos</div>
          <div className="sec-h">Estructura</div>
          <Pal onClick={()=>add("escenario")} nm="Escenario (mod. 2,44 x 1,80)" sw="#ea580c"/>
          <Pal onClick={()=>add("pista")} nm="Pista (mod. 1,20 x 1,20)" sw="#16a34a"/>
          <Pal onClick={()=>add("aereo")} nm="Aéreo de pista" sw="#7c3aed" dash/>
          <div className="sec-h" style={{marginTop:10}}>Decoración</div>
          <Pal onClick={()=>add("entelado")} nm="Entelado de pared" sw="#0d9488" wavy/>
          <Pal onClick={addTexto} nm="Texto / aclaración" sw="#7c3aed"/>
          {["Mesas","Servicio","Técnica","Otros"].map(cat=>(<div key={cat}><div className="sec-h" style={{marginTop:10}}>{cat}</div>{Object.entries(CAT).filter(([,v])=>v.cat===cat).map(([k,v])=><Pal key={k} onClick={()=>add(k)} nm={v.nm} sw={v.stroke} chair={k==="silla"}/>)}</div>))}
          <div className="muted">Entelado: agregalo y rotalo/estiralo contra la pared que quieras (una, dos o las que sean). DJ, parlante y aéreo: medidas editables a la derecha.</div>
        </div>
      </div>

      <div className="resizer" onMouseDown={e=>startResize("left",e)}/>
      <div className="col col-center" ref={centerRef}>
        <div className="toolbar">
          <button className="tb" title="Deshacer" disabled={!histRef.current.past.length} onClick={undo}><Ic d={I.undo} s={15}/></button>
          <button className="tb" title="Rehacer" disabled={!histRef.current.future.length} onClick={redo}><Ic d={I.redo} s={15}/></button>
          <button className="tb" title="Zoom In" onClick={()=>setScale(s=>Math.min(40,s+3))}><Ic d={I.zin} s={15}/></button>
          <button className="tb" title="Zoom Out" onClick={()=>setScale(s=>Math.max(7,s-3))}><Ic d={I.zout} s={15}/></button>
          <button className="tb" title="Girar la vista 90°" onClick={()=>setRot(r=>(r+90)%360)}><Ic d={I.rotate} s={15}/> 90°</button>
          <span className="tb-sep"/>
          <button className="tb" title="Alineación Horizontal" disabled={selIds.length<2} onClick={()=>groupAlign(hh?"y":"x")}><Ic d={I.alignY} s={15}/></button>
          <button className="tb" title="Alineación Vertical" disabled={selIds.length<2} onClick={()=>groupAlign(hh?"x":"y")}><Ic d={I.alignX} s={15}/></button>
          <button className="tb" title="Distribuir Horizontal" disabled={selIds.length<3} onClick={()=>groupDistribute(hh?"x":"y")}><Ic d={I.distX} s={15}/></button>
          <button className="tb" title="Distribuir Vertical" disabled={selIds.length<3} onClick={()=>groupDistribute(hh?"y":"x")}><Ic d={I.distY} s={15}/></button>
          <button className="tb" title="Agrupar los elementos seleccionados" disabled={selIds.length<2} onClick={agrupar}><Ic d={I.group} s={15}/> Agrupar</button>
          <button className="tb" title="Desagrupar" disabled={!selGrouped()} onClick={desagrupar}><Ic d={I.ungroup} s={15}/> Desagrupar</button>
          <button className={"tb "+(grid?"on":"off")} title="Mostrar/ocultar grilla" onClick={()=>setGrid(v=>!v)}><Ic d={I.grid} s={15}/> Grilla</button>
          <button className={"tb "+(showDoors?"on":"off")} title="Mostrar/ocultar divisorias" onClick={()=>setShowDoors(v=>!v)}>Puertas</button>
          {S.alturas&&<button className={"tb "+(showAlturas?"on":"off")} title="Mostrar/ocultar alturas de techo, viga y puertas" onClick={()=>setShowAlturas(v=>!v)}>Techo</button>}
          <button className={"tb "+(showSillas?"on":"off")} onClick={()=>setShowSillas(v=>!v)}><Ic d={I.eye} s={15}/> Sillas</button>
          <label className="f" style={{flexDirection:"row",alignItems:"center",gap:5,marginLeft:4}}>Imán<select value={imn} onChange={e=>setImn(+e.target.value)} style={{width:"auto"}}><option value={0}>off</option><option value={0.1}>10 cm</option><option value={0.25}>25 cm</option><option value={0.5}>50 cm</option></select></label>
        </div>
        <div className="canvas-box">
          <svg ref={svgRef} width={svgW} height={svgH} viewBox={`0 0 ${svgW} ${svgH}`} onPointerMove={move} onPointerUp={up} onPointerLeave={up} onPointerDown={svgDown} style={{touchAction:"none",maxWidth:"none"}}>
            <g transform={gT}>
              <g transform={`translate(${FOY*scale},0)`}>
              {foyerRender()}
              <path d={roomOutline()} fill="#fff" stroke="#1e3a5f" strokeWidth={2}/>
              {gridLines()}{els.map(renderEl)}{divisorias()}{puertas()}{salonWindows()}{fixtures()}{escalaBar()}{alturas()}
              {marquee&&<rect className="no-export" x={px(Math.min(marquee.x0,marquee.x1))} y={px(Math.min(marquee.y0,marquee.y1))} width={Math.abs(marquee.x1-marquee.x0)*scale} height={Math.abs(marquee.y1-marquee.y0)*scale} fill="rgba(30,58,95,.08)" stroke="#1e3a5f" strokeWidth={1} strokeDasharray="4 3"/>}
              </g>
            </g>
          </svg>
        </div>
        <div className="legend">
          <span><span className="dot" style={{background:"#16a34a"}}></span> Ingresos{showAlturas&&" (altura 2,65 m)"}</span>
          {(S.doors.porton||(showFoyer&&S.foyer&&S.foyer.porton))&&<span><span className="dot" style={{background:"#0e7490"}}></span> Portón{S.doors.porton&&showAlturas&&" (3,20 m ancho × 3 m alto)"}</span>}
          <span><span className="dot" style={{background:"#dc2626"}}></span> Ingreso Back</span>
          <span><span className="dot" style={{background:"#f59e0b"}}></span> Puertas Divisorias</span>
          <span><span className="dot" style={{background:"#0d9488"}}></span> Entelado</span>
          {((showFoyer&&S.foyer&&S.foyer.windows)||S.winSegs)&&<span><span className="dot" style={{background:"#7dd3fc"}}></span> Ventanas</span>}
          {showAlturas&&S.alturas&&<><span><span className="dot" style={{background:"#fdba74"}}></span> Altura {S.alturas.centro} m</span><span><span className="dot" style={{background:"#c4b5fd"}}></span> Altura {S.alturas.lateral} m</span>{S.alturas.viga&&<span><span className="dot" style={{background:"#111827",borderRadius:0}}></span> Viga (aguanta 100 kg por metro lineal)</span>}</>}
          <span>Salón: {fmt(W)} × {fmt(L)} m · {fmt(W*L)} m²</span>
        </div>
        <div className="muted" style={{marginTop:4}}>SHIFT+clic para sumar a la selección, o dibujá un recuadro sobre varios. ⌘Z deshacer · ⌘⇧Z rehacer.</div>
      </div>

      <div className="resizer" onMouseDown={e=>startResize("right",e)}/>
      <div className="col col-right" style={{width:rightW,flexShrink:0}}>
        <div className="card">
          <div className="card-h">{selIds.length>1?`${selIds.length} elementos seleccionados`:"Elemento seleccionado"}</div>
          {selIds.length>1?
            <div>
              {(()=>{const ss=els.filter(e=>selIds.includes(e.id));const same=ss.length>1&&ss.every(e=>esMesa(e.tipo)&&e.tipo===ss[0].tipo);const mx=same?maxSillas(ss[0]):0;return same?<div className="grid2" style={{marginBottom:9}}><NumF label={mx?("Sillas por mesa (máx "+mx+")"):"Sillas por mesa"} v={ss[0].sillas??0} min={0} max={mx} on={n=>{pushHist();setEls(p=>p.map(e=>selIds.includes(e.id)?{...e,sillas:n}:e));}}/></div>:null;})()}
              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                <button className="btn" onClick={()=>groupRotate(90)}><Ic d={I.rotate} s={14}/> 90°</button>
                <button className="btn" onClick={groupDup}><Ic d={I.copy} s={14}/></button>
                <button className="btn btn-danger" onClick={groupDel}><Ic d={I.trash} s={14}/> Borrar</button>
              </div>
            </div>
          : !selEl? <div className="muted">Tocá un elemento para moverlo o editarlo.</div> :
          <div>
            <div style={{fontSize:12,fontWeight:600,marginBottom:8}}>{labelTipo(selEl.tipo)}</div>
            <div className="grid2">
              {(selEl.tipo==="escenario"||selEl.tipo==="pista")&&<><StdF label="Cols" size={selEl.w} mod={selEl.modW} on={n=>updH(selEl.id,{cols:n,w:n*selEl.modW})}/><StdF label="Filas" size={selEl.h} mod={selEl.modH} on={n=>updH(selEl.id,{rows:n,h:n*selEl.modH})}/><NumF label="Ancho (m)" v={r2(selEl.w)} step={0.1} min={0.5} on={n=>updH(selEl.id,{w:n})}/><NumF label="Largo (m)" v={r2(selEl.h)} step={0.1} min={0.5} on={n=>updH(selEl.id,{h:n})}/></>}
              {esMesa(selEl.tipo)&&(()=>{const mx=maxSillas(selEl);return <NumF label={mx?("Sillas (máx "+mx+")"):"Sillas"} v={selEl.sillas??0} min={0} max={mx} on={n=>updH(selEl.id,{sillas:n})}/>;})()}
              {["dj","parlante","aereo","barra","pantalla","mesa_editable"].includes(selEl.tipo)&&<><NumF label="Ancho (m)" v={r2(selEl.w)} step={0.1} min={0.2} on={n=>updH(selEl.id,{w:n})}/><NumF label="Largo (m)" v={r2(selEl.h)} step={0.1} min={0.2} on={n=>updH(selEl.id,{h:n})}/></>}
              {selEl.tipo==="entelado"&&<NumF label="Largo (m)" v={r2(selEl.w)} step={0.5} min={0.5} on={n=>updH(selEl.id,{w:n})}/>}
              {selEl.tipo==="auditorio"&&<><NumF label="Filas" v={selEl.rows} min={1} on={n=>updAud(selEl.id,{rows:n})}/><NumF label="Columnas" v={selEl.cols} min={1} on={n=>updAud(selEl.id,{cols:n})}/><NumF label="Pasillos" v={selEl.aisles} min={0} on={n=>updAud(selEl.id,{aisles:n})}/><NumF label="Pasillo (m)" v={r2(selEl.aisleW)} step={0.1} min={0.3} on={n=>updAud(selEl.id,{aisleW:n})}/></>}
            </div>
            <div style={{display:"flex",gap:6,marginTop:9,flexWrap:"wrap"}}>
              <button className="btn" onClick={()=>rotOne(selEl.id,90)}><Ic d={I.rotate} s={14}/> 90°</button>
              <button className="btn" onClick={()=>rotOne(selEl.id,15)}>+15°</button>
              <button className="btn" onClick={()=>{pushHist();const e=els.find(x=>x.id===selEl.id);const c={...e,id:uid(),x:Math.min(W-.5,e.x+1),y:Math.min(L-.5,e.y+1)};setEls(p=>[...p,c]);setSelIds([c.id]);}}><Ic d={I.copy} s={14}/></button>
              <button className="btn btn-danger" onClick={()=>{pushHist();setEls(p=>p.filter(x=>x.id!==selEl.id));setSelIds([]);}}><Ic d={I.trash} s={14}/></button>
            </div>
          </div>}
        </div>
        <div className="card">
          <div className="card-h">Resumen</div>
          {Object.keys(counts).length===0?<div className="muted">Sin elementos.</div>:
          <div>{Object.entries(counts).map(([k,n])=><div className="row" key={k}><span style={{color:"#475569"}}>{labelTipo(k)}</span><span className="v">{n}</span></div>)}{cubiertos>0&&<div className="row" style={{borderTop:"1px solid #eef2f7",marginTop:5,paddingTop:5}}><span style={{color:"#475569",fontWeight:600}}>Cubiertos totales</span><span className="v" style={{fontWeight:700}}>{cubiertos}</span></div>}</div>}
        </div>
        {doc&&<div className="card" style={{borderLeft:"3px solid #1e3a5f",position:"relative"}}>
          <button title="Cerrar plano abierto y vaciar el plano" onClick={()=>{pushHist();setEls([]);setSelIds([]);setDoc(null);}} style={{position:"absolute",top:8,right:8,background:"none",border:"none",cursor:"pointer",color:"#94a3b8",padding:2,lineHeight:0}}><Ic d={I.x} s={16}/></button>
          <div className="card-h">Plano abierto</div>
          <div style={{fontSize:14,fontWeight:700,color:"#1e3a5f"}}>{doc.plano}</div>
          <div className="muted" style={{marginTop:2}}>{doc.evento}</div>
          <button className="btn btn-primary btn-block" style={{marginTop:8}} disabled={driveBusy} onClick={guardarCambios}><Ic d={I.save} s={14}/> Guardar cambios</button>
        </div>}
        <div className="card">
          <div className="card-h">Planos</div>
          <div style={{display:"flex",gap:6}}>
            <button className="btn btn-primary btn-block" onClick={abrirGuardar} disabled={driveBusy}><Ic d={I.save} s={14}/> Guardar plano</button>
            <button className="btn btn-block" onClick={abrirAbrir} disabled={driveBusy}><Ic d={I.folder} s={14}/> Abrir plano</button>
          </div>
        </div>
      </div>
    </div>
    {exportOpen&&<div className="modal-bg" onClick={()=>setExportOpen(false)}>
      <div className="modal" style={{width:940,maxWidth:"96vw"}} onClick={e=>e.stopPropagation()}>
        <div className="modal-h"><span>Exportar plano</span><button onClick={()=>setExportOpen(false)} style={{background:"none",border:"none",cursor:"pointer",color:"#64748b",padding:2,lineHeight:0}}><Ic d={I.x} s={18}/></button></div>
        <div style={{display:"flex",gap:16,alignItems:"flex-start",flexWrap:"wrap"}}>
          <div style={{flex:"1 1 360px",background:"#eef2f7",borderRadius:8,padding:12,display:"flex",justifyContent:"center",alignItems:"center",minHeight:320,maxHeight:"66vh",overflow:"auto"}}>
            {exportPreview?<img src={exportPreview} alt="Previsualización" style={{maxWidth:"100%",maxHeight:"60vh",background:"#fff",boxShadow:"0 2px 14px rgba(0,0,0,.16)"}}/>:<div className="muted">Generando previsualización…</div>}
          </div>
          <div style={{width:230,flexShrink:0,display:"flex",flexDirection:"column",gap:15}}>
            <div>
              <div className="muted" style={{marginBottom:6,fontWeight:600}}>Tipo de archivo</div>
              <div style={{display:"flex",gap:6}}>
                <button className={"btn "+(expFmt==="png"?"btn-primary":"")} style={{flex:1}} onClick={()=>setExpFmt("png")}>PNG</button>
                <button className={"btn "+(expFmt==="pdf"?"btn-primary":"")} style={{flex:1}} onClick={()=>setExpFmt("pdf")}>PDF</button>
              </div>
            </div>
            <div>
              <div className="muted" style={{marginBottom:6,fontWeight:600}}>Zoom</div>
              <div style={{display:"flex",gap:6}}>
                <button className="btn" style={{flex:1}} title="Alejar" onClick={()=>setScale(s=>Math.max(7,s-3))}><Ic d={I.zout} s={16}/></button>
                <button className="btn" style={{flex:1}} title="Acercar" onClick={()=>setScale(s=>Math.min(40,s+3))}><Ic d={I.zin} s={16}/></button>
              </div>
            </div>
            <div>
              <div className="muted" style={{marginBottom:6,fontWeight:600}}>Orientación</div>
              <button className="btn btn-block" onClick={()=>setRot(r=>(r+90)%360)}><Ic d={I.rotate} s={15}/> Girar 90°</button>
            </div>
            {S.alturas&&<div>
              <div className="muted" style={{marginBottom:6,fontWeight:600}}>Capa Techo</div>
              <button className={"btn btn-block "+(showAlturas?"btn-primary":"")} onClick={()=>setShowAlturas(v=>!v)}><Ic d={I.grid} s={15}/> {showAlturas?"Ocultar Techo":"Mostrar Techo"}</button>
            </div>}
            <label style={{display:"flex",alignItems:"center",gap:8,cursor:"pointer",fontSize:13,fontWeight:600,color:"#334155"}}><input type="checkbox" checked={expResumen} onChange={e=>setExpResumen(e.target.checked)}/> Incluir Resumen</label>
            <button className="btn btn-primary btn-block" style={{marginTop:4}} onClick={exportPlano}><Ic d={I.download} s={15}/> Exportar {expFmt.toUpperCase()}</button>
          </div>
        </div>
      </div>
    </div>}
    {drive&&<div className="modal-bg" onClick={()=>!driveBusy&&setDrive(null)}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-h">
          <span>{drive.mode==="saveName"?"Guardar plano":drive.mode==="saveList"?"Guardar plano":drive.mode==="saveForm"?"Nuevo evento":drive.mode==="openFiles"?("Planos · "+drive.evento):"Abrir plano"}</span>
          <button className="xbtn" onClick={()=>setDrive(null)}><Ic d={I.x} s={16}/></button>
        </div>
        {driveBusy&&<div className="muted" style={{marginBottom:6}}>Cargando…</div>}
        {drive.mode==="saveName"&&<div>
          <label className="f">Nombre del archivo<input value={planName} onChange={e=>setPlanName(e.target.value)} placeholder="Nombre del plano"/></label>
          <button className="btn btn-primary btn-block" style={{marginTop:12}} disabled={driveBusy} onClick={irACarpetas}>Guardar</button>
        </div>}
        {drive.mode==="saveList"&&<div>
          <div className="muted" style={{marginBottom:8}}>Guardando: <b>{planName||"(sin nombre)"}</b></div>
          <div className="sec-h">Elegí el evento</div>
          <div className="modal-list">
            {drive.eventos.length===0&&<div className="muted">Todavía no hay eventos.</div>}
            {drive.eventos.map(ev=><button key={ev} className="folder-row" disabled={driveBusy} onClick={()=>saveToFolder(ev)}><Ic d={I.folder} s={14}/> {ev}</button>)}
          </div>
          <button className="btn btn-primary btn-block" style={{marginTop:10}} onClick={()=>setDrive({...drive,mode:"saveForm"})}>＋ Crear nuevo evento</button>
        </div>}
        {drive.mode==="saveForm"&&<div>
          <label className="f">Fecha del evento<input type="date" value={form.fecha} onChange={e=>setForm({...form,fecha:e.target.value})}/></label>
          <label className="f" style={{marginTop:8}}>Tipo de evento<select value={form.tipo} onChange={e=>setForm({...form,tipo:e.target.value})}>{["Fiesta de 15","Boda","Cumpleaños","Bar / Bat Mitzvá","Evento"].map(t=><option key={t} value={t}>{t}</option>)}</select></label>
          <label className="f" style={{marginTop:8}}>Nombre protagonista/s<input value={form.nombre} onChange={e=>setForm({...form,nombre:e.target.value})} placeholder="Ej: Sofía / Mateo y Lucía"/></label>
          <div className="muted" style={{marginTop:6}}>Evento: <b>{nombreCarpeta()||"(completá los datos)"}</b></div>
          <div style={{display:"flex",gap:6,marginTop:10}}>
            <button className="btn" onClick={()=>setDrive({...drive,mode:"saveList"})}>← Volver</button>
            <button className="btn btn-primary btn-block" disabled={driveBusy} onClick={createAndSave}>Crear y guardar</button>
          </div>
        </div>}
        {drive.mode==="openList"&&<div>
          <div className="modal-list">
            {drive.eventos.length===0&&<div className="muted">Todavía no hay eventos guardados.</div>}
            {drive.eventos.map(ev=><div key={ev} className="row-del"><button className="folder-row" style={{flex:1}} disabled={driveBusy} onClick={()=>openFolderFiles(ev)}><Ic d={I.folder} s={14}/> {ev}</button><button className="del-btn" title="Eliminar evento" disabled={driveBusy} onClick={()=>borrarEvento(ev)}><Ic d={I.trash} s={14}/></button></div>)}
          </div>
        </div>}
        {drive.mode==="openFiles"&&<div>
          <button className="btn" style={{marginBottom:8}} onClick={()=>setDrive({mode:"openList",rows:drive.rows,eventos:drive.eventos})}>← Eventos</button>
          <div className="modal-list">
            {drive.plans.length===0&&<div className="muted">No hay planos en este evento.</div>}
            {drive.plans.map((row,i)=><div key={i} className="row-del"><button className="folder-row" style={{flex:1}} disabled={driveBusy} onClick={()=>loadDriveFile(row)}><Ic d={I.folder} s={14}/> {row.plano}</button><button className="del-btn" title="Eliminar plano" disabled={driveBusy} onClick={()=>borrarPlano(drive.evento,row.plano)}><Ic d={I.trash} s={14}/></button></div>)}
          </div>
        </div>}
      </div>
    </div>}
    {toast&&<div className="toast">{toast}</div>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
